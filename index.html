
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>404 - Not found</title>
<meta name="description" content="This subdomain does not exist.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#171717">
<link rel="icon" href="https://4ndra.com/avatar.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#171717;--bar:#111;--line:#2a2a2a;--dim:#8c8c8c;--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:"Inter Tight","Helvetica Neue",Arial,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;background:var(--bg);color:#dedede;font:400 13.5px/22px var(--mono);-webkit-font-smoothing:antialiased;overflow:hidden}
header{display:flex;align-items:stretch;height:32px;flex:none;background:var(--bar);border-bottom:1px solid var(--line)}
.tab{display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--bg);color:#fff;font-size:12px;box-shadow:inset 0 1px #f2f2f2}
.tab svg{width:14px;height:14px}
.crumbs{display:flex;align-items:center;height:26px;flex:none;padding:0 16px 0 72px;border-bottom:1px solid var(--line);color:var(--dim);font-size:12px;white-space:nowrap;overflow:hidden}
.crumbs b{font-weight:400;color:#d0d0d0}
.crumbs i{margin:0 8px;font-style:normal;opacity:.6}
.editor{position:relative;flex:1;display:flex;min-height:0}
#gutter{flex:none;width:52px;padding-right:10px;text-align:right;color:#c8c8c8;font-size:11px;white-space:pre;border-right:1px solid var(--line);overflow:hidden;user-select:none}
main{flex:1;min-width:0;display:flex;align-items:center;padding:0 clamp(20px,6vw,72px)}
.box{max-width:560px}
h1{margin:0;font:600 clamp(96px,22vw,200px)/.9 var(--sans);letter-spacing:-.05em;color:#fff;white-space:nowrap}
.ch{display:inline-block}
h2{margin:20px 0 8px;font:600 clamp(22px,3.2vw,30px)/1.15 var(--sans);letter-spacing:-.02em;color:#fff;overflow-wrap:anywhere}
p{margin:0 0 28px;color:#a5a5a5;max-width:46ch}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 20px;border:1px solid #f2f2f2;background:#f2f2f2;color:#111;font:500 12.5px var(--mono);text-decoration:none;transition:background-color .2s,transform .15s}
.btn:hover{background:#fff}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:1px solid #f2f2f2;outline-offset:3px}
::selection{background:#4a4a4a;color:#fff}
@media (max-width:640px){
#gutter{width:30px;padding-right:6px;font-size:10px}
.crumbs{padding-left:42px}
.btn{width:100%}
}
@media (prefers-reduced-motion:reduce){
*{animation:none!important;transition:none!important}
}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QFRYX9FPTJ"></script>
<script>
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments)}
gtag("js",new Date());
gtag("config","G-QFRYX9FPTJ",{
  page_title:"404",
  page_location:location.href
});
</script>
</head>
<body>
<header>
<div class="tab">
<svg viewBox="0 0 16 16" aria-hidden="true">
<path d="M3.5 1.5h6l3 3v10h-9zM9.5 1.5v3h3" fill="none" stroke="currentColor"/>
</svg>
404.md
</div>
</header>

<div class="crumbs">
<span id="host">4ndra.com</span>
<i>&rsaquo;</i>
<b>404.md</b>
</div>

<div class="editor">
<div id="gutter" aria-hidden="true"></div>
<main>
<div class="box" id="box">
<h1 id="num" aria-label="404">
<span class="ch">4</span><span class="ch">0</span><span class="ch">4</span>
</h1>
<h2 id="msg">This page does not exist</h2>
<p>This subdomain is not set up, or it was removed.</p>
<a class="btn" id="go" href="https://4ndra.com">Go to 4ndra.com</a>
</div>
</main>
</div>

<script>
function detectOriginalHost(){
  const params=new URLSearchParams(location.search);
  const forwardedHost=params.get("host");

  if(forwardedHost){
    const host=forwardedHost.toLowerCase();

    if(
      host.length<=253 &&
      host.endsWith(".4ndra.com") &&
      host!=="4ndra.com" &&
      /^[a-z0-9.-]+$/.test(host) &&
      !host.includes("..") &&
      !host.startsWith(".") &&
      !host.endsWith(".")
    ){
      return host;
    }
  }

  try{
    if(document.referrer){
      const ref=new URL(document.referrer);
      const hostname=ref.hostname.toLowerCase();

      if(
        ref.protocol==="https:" &&
        (hostname==="4ndra.com" || hostname.endsWith(".4ndra.com"))
      ){
        return hostname;
      }
    }
  }catch(e){}

  const currentHost=location.hostname.toLowerCase();

  if(
    currentHost==="4ndra.com" ||
    currentHost.endsWith(".4ndra.com")
  ){
    return currentHost;
  }

  return "4ndra.com";
}

const host=detectOriginalHost();

document.getElementById("host").textContent=host;
document.getElementById("msg").textContent=host+" does not exist";
document.title="404 - "+host;

document.querySelector('meta[name="description"]')
.setAttribute("content",host+" does not exist.");

const g=document.getElementById("gutter");

function lines(){
  const n=Math.max(
    1,
    Math.floor((document.getElementById("box").offsetHeight+40)/22)
  );

  let s="";
  for(let i=1;i<=n;i++)s+=i+"\n";
  g.textContent=s;
}

lines();
addEventListener("resize",lines);

if(!matchMedia("(prefers-reduced-motion:reduce)").matches){
  const els=[...document.querySelectorAll(".ch,#msg,.box p,.btn")];

  els.forEach((el,i)=>{
    const r=(k)=>{
      const x=Math.sin((i+1)*127.1+k*311.7)*43758.5453;
      return x-Math.floor(x)-.5;
    };

    el.animate([
      {
        transform:"translate("+r(1)*220+"px,"+r(2)*160+"px) rotate("+r(3)*40+"deg) scale(.85)",
        opacity:0
      },
      {
        transform:"none",
        opacity:1
      }
    ],{
      duration:560,
      delay:i*70,
      easing:"cubic-bezier(.2,.9,.25,1)",
      fill:"backwards"
    });
  });
}
</script>
</body>
</html>
